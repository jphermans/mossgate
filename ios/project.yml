name: Mossgate
options:
  bundleIdPrefix: io.jphsystems
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # ── Versioning ───────────────────────────────────────────────────────────
    # Bump CURRENT_PROJECT_VERSION on EVERY change batch (it must also strictly
    # increase for each App Store Connect upload). Bump MARKETING_VERSION at
    # feature milestones.
    #   ./scripts/bump-ios-version.py            # build +1        (every batch)
    #   ./scripts/bump-ios-version.py --patch    # 0.1.0 -> 0.1.1  (bugfix batch)
    #   ./scripts/bump-ios-version.py --minor    # 0.1.0 -> 0.2.0  (new features)
    # The script rewrites these two lines and re-runs xcodegen.
    MARKETING_VERSION: "0.7.4"
    CURRENT_PROJECT_VERSION: "27"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_NAME: Mossgate
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_BackgroundColor: "MossgateDusk"
    INFOPLIST_KEY_UILaunchScreen_ImageName: "LaunchLantern"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIRequiresFullScreen: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: "Mossgate"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.games"
    INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: YES
    INFOPLIST_KEY_UIStatusBarStyle: "UIStatusBarStyleLightContent"
    # Game controller support. This key is what makes iOS deliver controller
    # input and lets users remap buttons in Settings; App Store shows the
    # controller badge for it.
    #
    # NOTE: the companion key GCSupportedGameControllers (which would also declare
    # the accepted profiles) is a dictionary of ProfileName entries, and the
    # INFOPLIST_KEY_* build settings can only express scalars and flat arrays —
    # setting it here silently produces nothing. Controller input does not depend
    # on it; adding it needs a real Info.plist file rather than the generated one.
    INFOPLIST_KEY_GCSupportsControllerUserInteraction: "YES"

targets:
  Mossgate:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Mossgate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.jphsystems.mossgate
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: MossgateDusk